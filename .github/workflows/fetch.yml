name: fetch

on:
  schedule:
    - cron: "17 3 * * *"        # 매일 03:17 UTC (한국시간 12:17) — 지연될 수 있음
    - cron: "17 13 * * *"       # 매일 13:17 UTC (한국시간 22:17) — 하루 2회로 지연 보완
  push:
    branches: [claude/website-automation-programming-6umiay]
    paths: ["src/**", "config/**"]   # 코드/설정 변경 시에만 (봇의 결과 커밋은 제외)
  workflow_dispatch:
    inputs:
      probe:
        description: "API 스키마 확인만 실행 (사이트 생성 안 함)"
        type: boolean
        default: false

permissions:
  contents: write               # data/, docs/ 결과를 저장소에 커밋

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe API schema
        if: ${{ inputs.probe }}
        run: python src/main.py --probe

      - name: Run pipeline
        if: ${{ !inputs.probe }}
        run: python src/main.py

      - name: Commit results
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stats $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
