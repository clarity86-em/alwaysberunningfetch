# ABR(alwaysberunning.net) 통계 파이프라인 설정

site_title: "Netrunner Meta Tracker"
site_subtitle: "alwaysberunning.net 대회 결과 기반 identity 통계"

# 이 날짜 이후 종료된 대회만 수집 (시즌 시작일)
season_start: "2026-01-01"

# 포함할 포맷 (ABR의 format 필드값, 소문자)
formats:
  - standard
  - startup

# 최소 참가자 수 (이보다 작은 대회는 통계에서 제외). 포맷별로 다르게 지정 가능
min_players:
  standard: 8
  startup: 4
  default: 8

# 한 번에 스캔할 최근 종료 대회 수 (ABR API limit).
# 목록은 캐시와 누적 병합되므로, 한 번 잡힌 대회는 밀려나도 유지됨
scan_limit: 500

# 밴리스트 발효일 (경쟁 티어 기준). 대회 날짜로 밴리스트를 판정한다 —
# ABR의 주최자 입력(mwl)은 오표기가 많아 신뢰하지 않음.
# 새 밴리스트가 나오면 여기에 한 줄 추가하면 됨.
banlist_schedule:
  standard:
    - {version: "26.05", from: "2026-05-01"}
    - {version: "26.03", from: "2026-03-13"}
    - {version: "25.12", from: "2025-12-01"}

# 대회 위상(티어). ABR의 type 필드값(소문자) -> 티어 이름/순서/공식성
# formality: competitive = NSG 경쟁 티어(리얼 대회), casual = 캐주얼 티어
# 참고: NSG Competitive Season Tracker (worlds > continentals > megacity > district > casual)
tiers:
  worlds:
    rank: 1
    label: "Worlds"
    always: true
    formality: competitive
    desc: >-
      World Championship. 한 해 조직 플레이의 정점으로, NSG가 직접 주최하는
      연 1회 오프라인 대회입니다. 대회라기보다 3일간의 컨벤션에 가까운 최정상 이벤트로,
      2026년은 10월 2~4일 캐나다 몬트리올에서 열립니다.
  intercontinental championship:
    rank: 1
    label: "Intercontinentals"
    formality: competitive
    desc: >-
      각 대륙 챔피언십(EMEA/Americas/APAC)의 상위 입상자들만 초청되어
      대륙 대표 간 최강자를 가리는 소수 정예 초청전입니다.
  continental championship:
    rank: 2
    label: "Continentals"
    always: true
    formality: competitive
    desc: >-
      NSG의 프리미어 이벤트. 유럽·중동·아프리카(EMEA), 아메리카, 아시아-태평양(APAC)
      세 권역에서 각각 오프라인 1회 + 온라인 1회가 열립니다. 오프라인 대회는
      지역 주최자가 NSG의 후원을 받아 운영하고, 온라인 대회는 NSG가 직접 운영합니다.
      3~4분기에 개최됩니다.
  circuit breaker invitational:
    rank: 6
    label: "Invitational"
    always: true
    formality: competitive
    desc: >-
      Circuit Breaker Invitational. 매년 1월 NSG가 온라인으로 주최하는 초청전으로,
      한 경쟁 시즌을 마무리하고 다음 시즌을 여는 이벤트입니다. 전년도 공인 대회
      (District/Megacity 등)의 우승자와 상위 입상자만 초청받으며, 전년도 최고
      플레이어들을 조명하는 자리입니다.
  nationals:
    rank: 3
    label: "Nationals"
    formality: competitive
    desc: >-
      국가 단위 챔피언십. 현행 District/Megacity 체계 이전(FFG 시대~NSG 초기)의
      대회 구조로, 과거 대회 기록에서 볼 수 있습니다.
  national championship:
    rank: 3
    label: "Nationals"
    formality: competitive
    desc: >-
      국가 단위 챔피언십. 현행 District/Megacity 체계 이전(FFG 시대~NSG 초기)의
      대회 구조로, 과거 대회 기록에서 볼 수 있습니다.
  megacity championship:
    rank: 3
    label: "Megacity"
    always: true
    formality: competitive
    desc: >-
      광역 생활권 단위의 경쟁 티어 챔피언십. 이동 3~4시간 권역당 1개로 수가 제한되며,
      주최자가 신청서를 내면 NSG가 심사해 개최권을 부여합니다.
      매년 5~7월(2분기)에 열리고, 포맷은 Standard입니다.
  district championship:
    rank: 4
    label: "District"
    always: true
    formality: competitive
    desc: >-
      경쟁 티어 중 가장 접근성 높은 지역 챔피언십. 당일 이동 가능한 거리에서
      10인 이상을 꾸준히 모을 수 있는 커뮤니티에 개최권이 주어지며,
      넓은 지역엔 복수 개최도 허용됩니다. 매년 1분기에 열리고, 포맷은 Standard입니다.
  regional:
    rank: 4
    label: "Regional"
    formality: competitive
    desc: >-
      지역 단위 대회. 구 체계(FFG 시대)의 티어로, 과거 대회 기록에서 볼 수 있습니다.
  store championship:
    rank: 5
    label: "Store Champ"
    formality: competitive
    desc: >-
      매장 단위 챔피언십. 게임 매장이 주최하는 소규모 경쟁 대회입니다.
  circuit opener:
    rank: 5
    label: "Circuit Opener"
    formality: competitive
    desc: >-
      시즌 개막을 알리는 이벤트. 본격적인 챔피언십 시즌 전에 열리는 진입용 경쟁 대회입니다.
  players circuit:
    rank: 5
    label: "Circuit"
    formality: competitive
    desc: >-
      NSG 공식 체계 밖에서 커뮤니티가 운영하는 경쟁 대회 서킷. 대표적으로
      NANPC(북미 넷러너 플레이어즈 서킷)가 있으며, 2024년부터 북미 각 도시에서
      주말 양일(토 스위스, 일 탑컷)로 열리는 리저널급 오프라인 대회 시리즈입니다.
      자체 리더보드와 상품 지원을 운영합니다.
  team tournament:
    rank: 9
    label: "Team"
    formality: casual
    desc: >-
      팀 단위로 진행되는 이벤트성 대회입니다.
  casual tournament kit:
    rank: 7
    label: "CTK"
    formality: casual
    desc: >-
      Casual Tournament Kit. 시즌 초·중반의 입문용 이벤트로, 많은 신규 플레이어가
      처음 참가하는 구조화된 대회입니다. 지역 주최자가 키트를 구매해 열며 개최 수 제한이 없고,
      포맷은 주최자 재량으로 Standard 또는 Startup입니다.
  "gnk / seasonal":
    rank: 8
    label: "GNK"
    formality: casual
    desc: >-
      Game Night Kit. 매장이나 모임에서 분기별 키트로 여는 가장 가벼운 캐주얼 대회입니다.
  community tournament:
    rank: 9
    label: "Community"
    formality: casual
    desc: >-
      NSG 공식 체계 밖에서 커뮤니티가 자체 기획·주최하는 대회입니다.
  online event:
    rank: 9
    label: "Online"
    formality: casual
    desc: >-
      온라인(jinteki.net 등)으로 진행되는 대회입니다.
  asynchronous tournament:
    rank: 10
    label: "Async"
    formality: casual
    desc: >-
      정해진 시각에 모이지 않고 기간을 두고 라운드를 소화하는 비동기 온라인 대회입니다.

# 여기 나열된 type은 아예 수집하지 않음
exclude_types:
  - non-tournament event
